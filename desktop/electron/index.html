<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Control Desktop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">iMac Remote</p>
        <h1>Ready for iPhone control</h1>
        <div id="statusBadge" class="status waiting">Waiting</div>
      </section>

      <section class="panel">
        <div class="row">
          <span>WebSocket</span>
          <strong id="serverUrl">Starting...</strong>
        </div>
        <div class="row">
          <span>Clients</span>
          <strong id="clientCount">0</strong>
        </div>
      </section>

      <section class="panel">
        <span class="label">Local IP addresses</span>
        <div id="addressList" class="addresses"></div>
      </section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
